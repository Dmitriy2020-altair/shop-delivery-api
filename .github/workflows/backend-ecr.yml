name: Backend ECR

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 853255354222.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: shop-delivery-api
  IAM_ROLE_ARN: arn:aws:iam::853255354222:role/ShopDeliveryGitHubActionsECRPushPolicy

jobs:
  build-and-push:
    name: Backend CI and ECR push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backend unit tests
        run: pnpm --filter backend test

      - name: Backend TypeScript check
        run: pnpm --filter backend typecheck

      # TEMPORARY: decode OIDC claims only (never log the raw token).
      # Remove after AWS trust policy is aligned with actual claims.
      - name: Diagnose GitHub OIDC claims
        run: |
          set -euo pipefail

          OIDC_RESPONSE="$(curl -sS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")"

          OIDC_JWT="$(printf '%s' "$OIDC_RESPONSE" | jq -r '.value')"

          if [ -z "$OIDC_JWT" ] || [ "$OIDC_JWT" = "null" ]; then
            echo "Failed to obtain OIDC token from GitHub Actions"
            exit 1
          fi

          # Decode JWT payload (middle segment) without printing the token.
          PAYLOAD_B64="$(printf '%s' "$OIDC_JWT" | cut -d '.' -f 2)"
          PAD_LEN=$(( (4 - ${#PAYLOAD_B64} % 4) % 4 ))
          PAYLOAD_B64_PADDED="${PAYLOAD_B64}$(printf '=%.0s' $(seq 1 "$PAD_LEN"))"
          PAYLOAD_JSON="$(printf '%s' "$PAYLOAD_B64_PADDED" | tr '_-' '/+' | base64 -d 2>/dev/null)"

          unset OIDC_JWT OIDC_RESPONSE

          echo "OIDC claims (selected):"
          printf '%s' "$PAYLOAD_JSON" | jq '{
            iss,
            aud,
            sub,
            repository,
            repository_id,
            repository_owner,
            repository_owner_id,
            ref,
            event_name
          }'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          # Final Dockerfile stage is `runner` (production).
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
